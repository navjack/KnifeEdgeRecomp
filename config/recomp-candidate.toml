[[patches.hook]]
# The retrace receiver thread, just after osRecvMesg on the VI queue returns.
# Says whether ultramodern's retrace message reaches the game at all, which is
# the first link of the chain that ends in a drawn frame.
func = "func_800D2214"
before_vram = 0x800D2284
text = "knife_edge_pipeline_retrace(rdram, ctx);"

[[patches.hook]]
# The frame-callback thread, just after osRecvMesg on its own queue returns.
func = "func_800D2930"
before_vram = 0x800D29C8
text = "knife_edge_pipeline_callback(rdram, ctx);"

[[patches.hook]]
# func_800D1FE0 entry. It zeroes the event-client list heads, so a second call
# after clients have registered unregisters all of them.
func = "func_800D1FE0"
before_vram = 0x800D1FE4
text = "knife_edge_pipeline_event_init(rdram, ctx);"

[[patches.hook]]
# func_800D23FC, immediately before it osSendMesgs to a matching client. a0 is
# that client's queue, a1 the event pointer sent as the message.
func = "func_800D23FC"
before_vram = 0x800D2440
text = "knife_edge_pipeline_dispatch(rdram, ctx);"

[[patches.hook]]
# The overlay's frame callback at entry, where a0 is the outstanding graphics
# task count it uses to decide whether to draw this frame at all.
func = "ovl_03D600_func_8017B170"
before_vram = 0x8017B174
text = "knife_edge_pipeline_frame(rdram, ctx);"

[[patches.hook]]
# Immediately after the frame callback returns, to compare sp against the value
# at the receive above it.
func = "func_800D2930"
before_vram = 0x800D29F4
text = "knife_edge_pipeline_returned(rdram, ctx);"
