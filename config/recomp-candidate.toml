[input]
# Experimental probe only. The candidate map is generated from Splat's
# control-flow boundaries; overlays, relocations and data symbols are
# unresolved, so its output is never treated as reviewed game metadata.
rom_file_path = "../rom/Knife Edge - Nose Gunner (U) [!].z64"
symbols_file_path = "../decomp/knife-edge.candidate.syms.toml"
output_func_path = "../generated-candidate"
entrypoint = 0x800C2400
functions_per_output_file = 50
recomp_include = "#include \"recomp.h\"\n#include \"game/overlay_bridge.h\"\n#include \"game/pipeline_trace.h\"\n#include \"game/guest_waits.h\""
uses_mips3_float_mode = false
# relocatable_sections_path is deliberately NOT set.
#
# In symbol-map mode it does not mark anything relocatable -- that is decided
# solely by the presence of a `relocs` array per section
# (upstream/N64Recomp/src/config.cpp) -- and without real reloc data marking
# these sections relocatable actively breaks resolution, because resolve_jal
# only accepts a candidate whose section is NOT relocatable. What the key does
# do is build the overlay-id table, which then fails on every name, since none
# of the sections are registered as relocatable. It also reads the file without
# stripping comments, so a `#` line is looked up as a section name.
#
# config/relocatable-sections.txt is kept as the record of which sections are
# swapped at runtime; wire it back up if real relocs ever become available.

[patches]
# Replaced natively rather than recompiled, which is what `ignored` is for: the
# body is dropped but the name is not renamed, so every call site emits
# func_800D2B40(rdram, ctx) and native/game/guest_waits.cpp supplies it.
#
# func_800D2B40 busy-waits on a pending-task count and calls nothing at all, so
# a faithful recompile never drains the runtime's external message queue and
# the SP/DP completions it is waiting for are never delivered.
ignored = [
    "func_800D2B40",
]

stubs = [
    # TLB and exception-vector routines. These intentionally leave the normal C
    # execution domain (tlbp/tlbr/tlbwi/eret), and after static recompilation
    # there is no TLB to probe: the runtime hands the game flat RDRAM. They stay
    # in the map so their addresses resolve, and are emitted as linkable no-ops
    # until a native exception bridge exists.
    "func_800DB6E0",  # __osProbeTLB  (mfc0 EntryHi, tlbp, tlbr)
    "func_800DC074",
    "func_800DC280",
    "func_800DC2D0",
    # __osException. Its second entry at 0x800DBE34 branches back to 0x800DBDEC,
    # so the candidate generator's widening absorbs it into this function and it
    # must NOT be listed separately -- N64Recomp hard-errors on a stub naming a
    # function that does not exist.
    "func_800DB900",
    "func_800DBF1C",
]

[[patches.hook]]
# Register runtime-loaded overlays. librecomp never watches DMA, so without this
# every overlay is invisible to get_function, which aborts the process rather
# than failing softly.
#
# All four of the game's overlay loaders funnel through func_800D1D10, a
# blocking DMA helper, so one hook covers every load with (rom, dest, size)
# already in hand. 0x800D1D80 is the instruction after osRecvMesg returns and
# before the epilogue: the bytes are in RDRAM and sp still addresses the frame
# holding the spilled arguments.
func = "func_800D1D10"
before_vram = 0x800D1D80
text = "knife_edge_overlay_dma(rdram, ctx);"

# Graphics pipeline probes. The boot thread posts one display list and then
# busy-waits on the pending count at 0x8013C280; when that count never drains,
# every thread in the chain is parked in osRecvMesg and a backtrace cannot say
# which step was the last one reached. These say it directly. See
# native/game/pipeline_trace.cpp; they are silent without
# KNIFE_EDGE_TRACE_PIPELINE.

[[patches.hook]]
# Right after func_800D1BB4's osSendMesg to the scheduler queue at 0x801423EC.
func = "func_800D1BB4"
before_vram = 0x800D1CE4
text = "knife_edge_pipeline_submitted(rdram, ctx);"

[[patches.hook]]
# func_800D2460's first osSpTaskStartGo returning.
func = "func_800D2460"
before_vram = 0x800D2528
text = "knife_edge_pipeline_started(rdram, ctx);"

[[patches.hook]]
# func_800D2460's second osSpTaskStartGo returning.
func = "func_800D2460"
before_vram = 0x800D2574
text = "knife_edge_pipeline_started(rdram, ctx);"

[[patches.hook]]
# func_800D25F0's osSpTaskStartGo returning.
func = "func_800D25F0"
before_vram = 0x800D26D8
text = "knife_edge_pipeline_started(rdram, ctx);"

[[patches.hook]]
# func_800D1730 about to store the decremented pending count, the write that
# releases the busy-wait in func_800D2B40.
func = "func_800D1730"
before_vram = 0x800D1824
text = "knife_edge_pipeline_completed(rdram, ctx);"

# Wait loops that spin on a flag without calling anything. Generated by
#   python3 tools/spin-scan/find_spin_loops.py --hooks
# and pasted here; regenerate after changing the symbol map, since each hook
# has to name the map's own function and those boundaries move.
#
# Every hook sits on the backward branch rather than its target: the target is
# a label, and a hook placed there can land outside the loop body. The game
# uses one idiom -- register a per-frame callback, spin until it sets
# D_8011D1B4 -- and repeats it verbatim in every overlay, which is why the same
# address shows up under so many section-qualified names.
#
# See native/game/guest_waits.cpp for what the poll does and why a faithful
# recompile of these loops deadlocks.

[[patches.hook]]
# waits on D_80128A60
func = "func_800CD710"
before_vram = 0x800CD7BC
text = "knife_edge_guest_poll(rdram, ctx);"

[[patches.hook]]
# waits on D_8011D1B4
func = "ovl_111CC0_func_8017E07C"
before_vram = 0x8017E0E4
text = "knife_edge_guest_poll(rdram, ctx);"

[[patches.hook]]
# waits on D_8010BAD0 D_8011D1B4
func = "ovl_111CC0_func_8017E07C"
before_vram = 0x8017E0F8
text = "knife_edge_guest_poll(rdram, ctx);"

